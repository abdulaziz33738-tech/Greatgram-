name: Build GreatGram APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract GreatGram Project Source
        run: |
          mkdir -p project
          unzip -q "*.zip" -d project

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('project/**/*.gradle*', 'project/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK with Gradle
        run: |
          # Check where gradlew is located and navigate correctly
          if [ -f "project/gradlew" ]; then
            cd project
          elif [ -f "gradlew" ]; then
            echo "Root gradlew found"
          else
            cd $(find project -maxdepth 2 -name "gradlew" -exec dirname {} \;)
          fi
          
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          
