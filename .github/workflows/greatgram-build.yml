name: Build GreatGram APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract GreatGram Project Source
      run: |
        mkdir -p project
        unzip -q "*.zip" -d project

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Build APK with Gradle
      run: |
        PROJECT_DIR=$(find project -name settings.gradle -type f -print -quit | xargs -r dirname)
        echo "Project directory: $PROJECT_DIR"
        cd $PROJECT_DIR
        gradle assembleRelease --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GreatGram-APK
        path: '**/build/outputs/apk/release/*.apk'
